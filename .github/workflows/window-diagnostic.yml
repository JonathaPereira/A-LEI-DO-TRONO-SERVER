name: Diagnose game window fullscreen
on:
  push:
    branches: [codex/games-polish-integration]
    paths: [.github/workflows/window-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm --prefix electron ci
      - name: Compare renderer and native keyboard delivery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/atalaia | Out-Null
          @'
          const {app,BrowserWindow,session,screen,dialog,Menu}=require('electron');
          const {createNexusLauncher}=require('../../electron/nexus.cjs');
          app.setPath('userData',require('path').join(require('os').tmpdir(),'atalaia-keys-'+process.pid));
          app.whenReady().then(async()=>{
            Menu.setApplicationMenu(Menu.buildFromTemplate([{label:'View',submenu:[{role:'togglefullscreen',accelerator:'F11'}]}]));
            const parent=new BrowserWindow();await parent.loadURL('data:text/html,<h1>Parent</h1>');
            await session.fromPartition('key-test').protocol.handle('https',()=>new Response('<h1>Game</h1>',{headers:{'Content-Type':'text/html'}}));
            const launcher=createNexusLauncher({BrowserWindow,session,screen,dialog,parent,partition:'key-test',config:{pageUrl:'https://atalaia-mn.surge.sh/',embedUrl:'',isEmbedURL:()=>false},extraOrigins:[],isQuitting:()=>true});
            await launcher.open();
            const game=BrowserWindow.getAllWindows().find(w=>w!==parent);
            global.events=[];global.game=game;
            game.webContents.on('before-input-event',(_,input)=>global.events.push({type:input.type,key:input.key,code:input.code,repeat:input.isAutoRepeat}));
            game.on('enter-full-screen',()=>global.events.push('enter'));
            game.on('leave-full-screen',()=>global.events.push('leave'));
          });
          '@ | Set-Content -Encoding utf8 artifacts/atalaia/key-app.cjs
          @'
          const {_electron}=require('@playwright/test');
          (async()=>{
            const app=await _electron.launch({executablePath:require('../../electron/node_modules/electron'),args:['artifacts/atalaia/key-app.cjs']});
            try {
              await new Promise(r=>setTimeout(r,1000));
              const game=app.windows().find(p=>p.url().includes('atalaia-mn'));await game.locator('h1').waitFor();
              await game.bringToFront();
              await game.keyboard.press('F11');await new Promise(r=>setTimeout(r,700));
              const cdp=await app.evaluate(()=>({full:global.game.isFullScreen(),events:[...global.events],focused:global.game.isFocused()}));
              await app.evaluate(()=>{global.events=[];global.game.setFullScreen(false);global.game.focus();});
              await new Promise(r=>setTimeout(r,500));
              await app.evaluate(()=>{global.game.webContents.sendInputEvent({type:'keyDown',keyCode:'F11'});global.game.webContents.sendInputEvent({type:'keyUp',keyCode:'F11'});});
              await new Promise(r=>setTimeout(r,700));
              const native=await app.evaluate(()=>({full:global.game.isFullScreen(),events:global.events,focused:global.game.isFocused()}));
              if(!native.full||cdp.events.length)throw Error('Unexpected keyboard diagnosis');
              const transitions=[];
              for(let turn=0;turn<3;turn++){
                await app.evaluate(()=>{global.game.focus();global.game.webContents.sendInputEvent({type:'keyDown',keyCode:'F11'});global.game.webContents.sendInputEvent({type:'keyUp',keyCode:'F11'});});
                await new Promise(r=>setTimeout(r,400));
                transitions.push(await app.evaluate(()=>global.game.isFullScreen()));
              }
              if(JSON.stringify(transitions)!=='[false,true,false]')throw Error('Native fullscreen did not toggle reliably: '+JSON.stringify(transitions));
              console.log('::notice title=Native fullscreen cycles::'+JSON.stringify(transitions));
              console.log('::notice title=Fullscreen paths::'+JSON.stringify({cdp,native}));
            } finally {await app.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          '@ | Set-Content -Encoding utf8 artifacts/atalaia/key-test.cjs
          node -e "require('./artifacts/atalaia/key-test.cjs')"
