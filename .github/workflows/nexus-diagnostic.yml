name: Check public Nexus embed
on:
  push:
    branches: [codex/games-polish-integration]
    paths: [.github/workflows/nexus-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect public itch page and configured embed
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, json
          for url in ['https://semchakra10.itch.io/nexus-mn', 'https://itch.io/embed-upload/19926871?color=333333', 'https://html-classic.itch.zone/html/19926871/index.html?v=1792595608']:
              try:
                  response=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40)
              except urllib.error.HTTPError as error:
                  response=error
              html=response.read().decode('utf8',errors='replace')
              sources=re.findall(r'(?:src|data-iframe)=["\']([^"\']+)',html)
              sources=[s for s in sources if 'embed-upload' in s or 'html-classic.itch.zone' in s]
              title=re.search(r'<title>(.*?)</title>',html,re.S)
              result={'url':url,'status':response.status,'final_url':response.url,'title':title.group(1) if title else '', 'embeds':sources, 'body_start':re.sub('<[^>]+>',' ',html)[:150], 'headers':{k:v for k,v in response.headers.items() if k.lower() in ['content-security-policy','x-frame-options','cross-origin-embedder-policy','cross-origin-opener-policy']}, 'engine_flags':re.findall(r'GODOT_(?:THREADS|SIMD)_ENABLED[^;]*',html), 'config':re.findall(r'const GODOT_CONFIG\s*=\s*(.*?);',html)}
              message=json.dumps(result).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Nexus public HTTP::'+message)
          PY
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Exercise the real export in an iframe and a standalone window
        run: |
          node <<'JS'
          const {chromium}=require('@playwright/test'),http=require('node:http');
          (async()=>{
            const server=http.createServer((req,res)=>res.end('<iframe sandbox="allow-scripts allow-same-origin allow-pointer-lock" allow="fullscreen; gamepad" style="width:100vw;height:100vh" src="https://itch.io/embed-upload/19926871?color=333333"></iframe>'));
            await new Promise(r=>server.listen(0,'127.0.0.1',r));
            const browser=await chromium.launch({args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            try{
              await Promise.all(['embedded','standalone'].map(async mode=>{
                const page=await browser.newPage(),errors=[],failed=[];
                page.on('console',m=>{if(['error','warning'].includes(m.type()))errors.push(m.text().slice(0,350));});
                page.on('pageerror',e=>errors.push(e.message));
                page.on('requestfailed',r=>failed.push({url:r.url(),reason:r.failure()}));
                const url=mode==='embedded'?'http://127.0.0.1:'+server.address().port:'https://itch.io/embed-upload/19926871?color=333333';
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForTimeout(60000);
                const frames=await Promise.all(page.frames().map(async f=>({url:f.url(),...await f.evaluate(()=>({text:document.body.innerText.slice(-700),canvas:!!document.querySelector('canvas'),engine:typeof Engine,isolated:crossOriginIsolated})).catch(e=>({error:e.message}))})));
                console.log('::notice title=Nexus live browser::'+JSON.stringify({mode,frames,errors:errors.slice(-18),failed:failed.slice(-8)}).replaceAll('%','%25').replaceAll('\n','%0A').replaceAll('\r','%0D'));
                await page.close();
              }));
            }finally{await browser.close();server.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
  windows:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix electron ci
      - name: Open the actual Electron Nexus launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/nexus | Out-Null
          @'
          const {app,BrowserWindow,session,screen,dialog}=require('../../electron/node_modules/electron');
          const {createNexusLauncher}=require('../../electron/nexus.cjs');
          app.commandLine.appendSwitch('use-angle','swiftshader');
          app.commandLine.appendSwitch('enable-unsafe-swiftshader');
          app.setPath('userData',require('path').join(require('os').tmpdir(),'nexus-live-'+process.pid));
          app.whenReady().then(async()=>{
            const errors=[],failed=[];
            app.on('web-contents-created',(_,c)=>{
              c.on('console-message',(_,level,message)=>{if(level>=2)errors.push(message.slice(0,350));});
              c.on('did-fail-load',(_,code,description,url)=>failed.push({code,description,url}));
            });
            session.fromPartition('persist:mn-nexus').webRequest.onErrorOccurred(d=>failed.push({url:d.url,error:d.error}));
            const parent=new BrowserWindow({show:false});
            const launcher=createNexusLauncher({BrowserWindow,session,screen,dialog,parent,isQuitting:()=>true});
            let launch;
            try{launch=await launcher.open();}catch(e){launch={error:e.message};}
            await new Promise(r=>setTimeout(r,90000));
            const game=BrowserWindow.getAllWindows().find(w=>w!==parent);
            const frames=game?await Promise.all([game.webContents.mainFrame,...game.webContents.mainFrame.frames].map(async f=>({url:f.url,...await f.executeJavaScript('({text:document.body.innerText.slice(-1000),canvas:!!document.querySelector("canvas"),engine:typeof Engine,isolated:crossOriginIsolated})').catch(e=>({error:e.message}))}))):[];
            console.log('::notice title=Nexus native startup::'+JSON.stringify({launch,frames,errors:errors.slice(-18),failed:failed.slice(-8)}).replaceAll('%','%25').replaceAll('\n','%0A').replaceAll('\r','%0D'));
            app.quit();
          }).catch(e=>{console.error(e);app.exit(1)});
          '@ | Set-Content -Encoding utf8 artifacts/nexus/native-probe.cjs
          node electron/node_modules/electron/cli.js artifacts/nexus/native-probe.cjs
