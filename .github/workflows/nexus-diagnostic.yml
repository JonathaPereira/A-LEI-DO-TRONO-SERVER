name: Check public Nexus embed
on:
  push:
    branches: [codex/games-polish-integration]
    paths: [.github/workflows/nexus-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public itch page and configured embed
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, json
          for url in ['https://semchakra10.itch.io/nexus-mn', 'https://itch.io/embed-upload/19926871?color=333333']:
              try:
                  response=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40)
              except urllib.error.HTTPError as error:
                  response=error
              html=response.read().decode('utf8',errors='replace')
              sources=re.findall(r'(?:src|data-iframe)=["\']([^"\']+)',html)
              sources=[s for s in sources if 'embed-upload' in s or 'html-classic.itch.zone' in s]
              title=re.search(r'<title>(.*?)</title>',html,re.S)
              result={'url':url,'status':response.status,'final_url':response.url,'title':title.group(1) if title else '', 'embeds':sources, 'body_start':re.sub('<[^>]+>',' ',html)[:150]}
              message=json.dumps(result).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Nexus public HTTP::'+message)
          PY
