name: Deliver voice reconnection recovery
on:
  push:
    branches: [codex/similo-delivery-control]
    paths: [.github/workflows/similo-delivery-control.yml]
permissions:
  contents: write
  actions: write
  pull-requests: write
concurrency:
  group: similo-delivery-control
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Run the existing Windows acceptance and publication, then report its real result
        uses: actions/github-script@v7
        with:
          script: |
            // Validate and publish the reviewed voice recovery on the existing delivery pipeline.
            const ref='codex/voice-reconnect-grace',branch='codex/similo-delivery-control';
            const repo=context.repo,path='similo-delivery-status.json';
            const {data:head}=await github.rest.git.getRef({...repo,ref:'heads/'+ref});
            const source=head.object.sha;
            const report={source,ref,version:'0.3.12',status:'dispatching',workflow:null,pullRequest:null,compare:`https://github.com/${repo.owner}/${repo.repo}/compare/main...${ref}?expand=1`,backendRequired:true};
            let fileSha;
            async function save(){
              const result=await github.rest.repos.createOrUpdateFileContents({...repo,branch,path,sha:fileSha,message:'chore: record Similo delivery status',content:Buffer.from(JSON.stringify({...report,updatedAt:new Date().toISOString()},null,2)+'\n').toString('base64')});
              fileSha=result.data.content.sha;
            }
            try{fileSha=(await github.rest.repos.getContent({...repo,path,ref:branch})).data.sha;}catch(e){if(e.status!==404)throw e;}
            await save();
            const started=Date.now();
            await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'windows-app.yml',ref,inputs:{publish_surge:'true',extended_browser:'false',refresh_instructions:'false',release_tag:''}});
            let run,last='';
            for(let n=0;n<102;n++){
              const {data}=await github.rest.actions.listWorkflowRuns({...repo,workflow_id:'windows-app.yml',branch:ref,event:'workflow_dispatch',per_page:10});
              run=data.workflow_runs.find(r=>r.head_sha===source&&Date.parse(r.created_at)>=started-10000);
              if(run){
                const jobs=(await github.rest.actions.listJobsForWorkflowRun({...repo,run_id:run.id,per_page:100})).data.jobs;
                report.workflow={id:run.id,url:run.html_url,status:run.status,conclusion:run.conclusion,jobs:jobs.map(j=>({id:j.id,name:j.name,status:j.status,conclusion:j.conclusion,steps:j.steps.map(s=>({name:s.name,status:s.status,conclusion:s.conclusion}))}))};
                report.status=run.status;
                const text=JSON.stringify(report.workflow);
                if(text!==last){last=text;await save();}
                if(run.status==='completed')break;
              }
              await new Promise(r=>setTimeout(r,20000));
            }
            if(!run||run.status!=='completed')throw Error('Windows acceptance is still pending; consult the workflow link in the status file.');
            if(run.conclusion!=='success'){
              for(const job of report.workflow.jobs.filter(j=>j.conclusion==='failure')){
                try{
                  const log=await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',{...repo,job_id:job.id});
                  const text=typeof log.data==='string'?log.data:Buffer.from(log.data).toString('utf8');
                  await github.rest.repos.createOrUpdateFileContents({...repo,branch,path:`similo-failure-${run.id}-${job.id}.log`,message:'chore: save masked failed job evidence',content:Buffer.from(text.split('\n').slice(-260).join('\n')).toString('base64')});
                }catch(e){report.failureLogError=e.message;}
              }
              await save();core.setFailed('Windows or publication failed. Inspect the recorded steps and logs.');return;
            }
            try{
              const title='Mantém a chamada durante quedas temporárias e reconecta automaticamente';
              const body=[
                'Uma perda breve do WebSocket encerrava a chamada e exigia entrada manual. Agora cliente e servidor reservam até 45 segundos para reautenticar e retomar a mesma identidade, sem recapturar microfone/câmera/tela nem recriar mídia estabelecida.',
                '',
                '- Recuperação sobre o único transport existente, com tentativas sequenciais, prazo global e eventos retidos até a confirmação.',
                '- Reserva de voz no servidor, ID/assento estáveis, capacidade aleatória validada pela mesma conta/sessão ou convidado e confirmação repetível quando a resposta se perde.',
                '- Sair durante a recuperação libera os dispositivos e não reativa a voz. Logout invalida comandos antigos; moderação, sessão substituída e expiração mantêm seus efeitos.',
                '- Rótulo de reconexão, preservação de mute, peers e sessões SFU, e operações SFU aguardando reautenticação. Controle remoto não é retomado.',
                '- Windows 0.3.12; sem migração SQL. Frontend e instalador publicados pela mesma execução aprovada.',
                '',
                'Validação local: typecheck, format:check, build e contratos core aprovados. Duas rodadas afetadas de navegador (11 aprovados, dois checks RTP/PCM bloqueados pela política Chromium gerenciada) e duas rodadas finais de recuperação com contas/sockets reais. Três quedas preservam mic/câmera/tela/peers; saída durante a quarta não volta à voz. Capturas e contas são fixtures explícitas.',
                'Windows valida também a perda de sinalização no Electron real, conservando microfone e captura nativa de janela. Aceitação completa/NSIS e publicação: '+run.html_url,
                '',
                'Auditoria de produção: três HTTP 200 e cinco pongs; SFU habilitado/configurado, sem limite bloqueado. TURN desativado/não configurado; primeira resposta de 22,6 s seguida de 95/107 ms. Isso não comprova a causa da queda relatada. Evidência pública: branch codex/similo-delivery-control, voice-server-audit.json.',
                '',
                '**Ativação:** incorporar e fazer deploy do backend; `/health` deve anunciar `features.voiceResume=true`. Servidor antigo mantém o comportamento anterior. Reservas são voláteis: restart do servidor e prazo esgotado ainda exigem entrar novamente.',
                'Operação e limites em docs/ATUALIZACOES.md e docs/ARQUITETURA.md. Não altera Godot, regras dos jogos ou configurações de produção.'
              ].join('\n');
              const existing=(await github.rest.pulls.list({...repo,state:'open',head:repo.owner+':'+ref})).data[0];
              const pr=existing||(await github.rest.pulls.create({...repo,head:ref,base:'main',title,body,draft:false})).data;
              report.pullRequest={number:pr.number,url:pr.html_url};
            }catch(e){report.pullRequestError=e.message;}
            report.publication={frontend:'https://a-lei-do-trono.surge.sh/',installer:'https://a-lei-do-trono.surge.sh/downloads/MN-Trono-0.3.12-Windows.exe',art:'https://similo-mn.surge.sh/version.json'};
            try{
              const response=await fetch('https://a-lei-do-trono-server.onrender.com/health',{signal:AbortSignal.timeout(45000)});
              const data=await response.json();report.backend={http:response.status,voiceResume:data.features?.voiceResume===true,similo:data.features?.similo===true,version:data.version};
            }catch(e){report.backend={error:e.message};}
            report.status='completed';await save();
