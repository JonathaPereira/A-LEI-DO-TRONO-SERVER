name: Read failed Windows acceptance details
on:
  push:
    branches: [codex/android-delivery-control]
    paths: [.github/workflows/windows-failure-inspection.yml]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo=context.repo, branch='codex/android-delivery-control';
            const job_id=123671736688;
            const log=await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',{...repo,job_id});
            const raw=typeof log.data==='string'?log.data:Buffer.from(log.data).toString('utf8');
            const lines=raw.split('\n'), sections=[];
            for(let i=0;i<lines.length;i++)if(/not ok \d+|testCodeFailure|TimeoutError|AssertionError/.test(lines[i]))sections.push(lines.slice(Math.max(0,i-8),i+48).join('\n'));
            const evidence=sections.join('\n\n').replace(/(access_token|refresh_token|authorization)[^\r\n]*/gi,'[credential field omitted]').replace(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/g,'[fixture credential omitted]');
            const report={runId:40937471474,job_id,evidence};
            const path='windows-1.0.1-failures.json';let sha;
            try{sha=(await github.rest.repos.getContent({...repo,path,ref:branch})).data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({...repo,branch,path,sha,message:'ci: record specific Windows failure',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')});
