name: Windows clips helper
on:
  push:
    branches: [main, codex/clips-sharing-refinements]
    paths: ['electron/clips-helper/**', 'electron/tests/**', '.github/workflows/windows-clips.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test local bridge and Windows hotkey registration
        run: dotnet run --project electron/tests -c Release
      - name: Publish standalone Windows x64 helper
        run: dotnet publish electron/clips-helper -c Release -r win-x64 --self-contained true -o build/windows-clips
      - name: Package executable and user instructions
        shell: pwsh
        run: |
          Remove-Item build/windows-clips/*.pdb
          Copy-Item electron/clips-helper/LEIA-ME-WINDOWS.txt build/windows-clips/LEIA-ME-WINDOWS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MN-Clipes-Windows-x64
          path: build/windows-clips/
          retention-days: 30
