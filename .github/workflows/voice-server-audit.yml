name: Read-only voice server audit
on:
  push:
    branches: [codex/similo-delivery-control]
    paths: [.github/workflows/voice-server-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sample public health and signaling without joining any room
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const report={checkedAt:new Date().toISOString(),health:[],signaling:[],errors:[]};
          const base='https://a-lei-do-trono-server.onrender.com';
          (async()=>{
            for(let i=0;i<3;i++){
              const started=Date.now();
              try{
                const response=await fetch(base+'/health',{signal:AbortSignal.timeout(45000)});
                const data=await response.json();
                report.health.push({http:response.status,elapsedMs:Date.now()-started,version:data.version,features:data.features,realtime:data.realtime,auth:{configured:data.auth?.configured,required:data.auth?.required}});
              }catch(e){report.errors.push(e.message);}
            }
            await new Promise(resolve=>{
              const socket=new WebSocket(base.replace('https:','wss:')+'/ws');
              let count=0,closed=false;
              const finish=()=>{if(closed)return;closed=true;clearTimeout(deadline);clearInterval(timer);socket.close();resolve();};
              const deadline=setTimeout(()=>{report.errors.push('WebSocket audit deadline');finish();},45000);
              const timer=setInterval(()=>{if(socket.readyState===1)socket.send(JSON.stringify({type:'ping'}));},3000);
              socket.onmessage=event=>{
                const message=JSON.parse(event.data);
                if(message.type==='welcome')report.signaling.push({type:'welcome',version:message.serverVersion,voiceResume:message.features?.voiceResume===true,realtime:message.realtime});
                if(message.type==='pong'){report.signaling.push({type:'pong',receivedAt:new Date().toISOString()});if(++count===5)finish();}
              };
              socket.onerror=()=>{report.errors.push('WebSocket connection error');finish();};
              socket.onclose=event=>{if(!closed){report.errors.push('Unexpected close '+event.code);finish();}};
            });
            report.healthy=report.health.length===3&&report.health.every(x=>x.http===200)&&report.signaling.filter(x=>x.type==='pong').length===5&&report.errors.length===0;
            fs.writeFileSync('voice-server-audit.json',JSON.stringify(report,null,2)+'\n');
          })().catch(error=>{report.errors.push(error.message);fs.writeFileSync('voice-server-audit.json',JSON.stringify(report,null,2)+'\n');process.exitCode=1;});
          JS
      - name: Retain only public diagnostic evidence
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),path='voice-server-audit.json',branch='codex/similo-delivery-control';
            if(!fs.existsSync(path))throw Error('No audit result was generated.');
            const content=fs.readFileSync(path),report=JSON.parse(content);let sha;
            try{sha=(await github.rest.repos.getContent({...context.repo,path,ref:branch})).data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({...context.repo,branch,path,sha,message:'chore: record public voice server health',content:content.toString('base64')});
            await core.summary.addRaw(content.toString()).write();
            if(!report.healthy)core.setFailed('A public service check failed; see the audit report.');
