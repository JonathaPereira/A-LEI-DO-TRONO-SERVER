name: Verify published Trono 1.0.1 and Android preview
on:
  push:
    branches: [codex/android-delivery-control]
    paths: [.github/workflows/android-production-check.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Read the live frontend, installer, portraits and backend without deploying
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('node:crypto');
            const repo=context.repo,branch='codex/android-delivery-control';
            const report={checkedAt:new Date().toISOString(),checks:{},errors:[]};
            for(let attempt=0;attempt<75;attempt++){
              const run=(await github.rest.actions.getWorkflowRun({...repo,run_id:40937471474})).data;
              if(run.status==='completed'){
                if(run.conclusion!=='success')throw Error('Windows delivery failed; publication verification must wait.');
                break;
              }
              if(attempt===74)throw Error('Windows delivery is still running.');
              await new Promise(r=>setTimeout(r,20000));
            }
            async function request(url,options={}) {
              const response=await fetch(url,{...options,signal:AbortSignal.timeout(60000)});
              if(!response.ok)throw Error(`HTTP ${response.status} from ${url}`);
              return response;
            }
            async function check(name,fn){
              try{report.checks[name]=await fn();}catch(e){report.errors.push({check:name,error:e.message});}
            }
            await check('repository',async()=>{
              const main=(await github.rest.git.getRef({...repo,ref:'heads/main'})).data.object.sha;
              const pulls=[];
              const found=(await github.rest.pulls.list({...repo,head:repo.owner+':codex/android-app',state:'all'})).data;
              for(const p of found) pulls.push({number:p.number,url:p.html_url,state:p.state,mergedAt:p.merged_at,mergeCommit:p.merge_commit_sha});
              const runs=(await github.rest.actions.listWorkflowRuns({...repo,workflow_id:'windows-app.yml',branch:'codex/android-app',per_page:3})).data.workflow_runs;
              const latest=runs[0];
              const jobs=latest?(await github.rest.actions.listJobsForWorkflowRun({...repo,run_id:latest.id})).data.jobs:[];
              return {main,pulls,windows:latest?{url:latest.html_url,source:latest.head_sha,status:latest.status,conclusion:latest.conclusion,jobs:jobs.map(j=>({name:j.name,conclusion:j.conclusion}))}:null};
            });
            await check('backend',async()=>{
              const response=await request('https://a-lei-do-trono-server.onrender.com/health');
              const data=await response.json();
              const preflight=await fetch('https://a-lei-do-trono-server.onrender.com/auth/login',{method:'OPTIONS',headers:{Origin:'https://localhost','Access-Control-Request-Method':'POST'},signal:AbortSignal.timeout(45000)});
              return {http:response.status,version:data.version,features:data.features,voiceResume:data.features?.voiceResume===true,similo:data.features?.similo===true,androidOriginStatus:preflight.status,androidOriginAllowed:preflight.status===204&&preflight.headers.get('access-control-allow-origin')==='https://localhost',androidPush:data.androidPush??null};
            });
            await check('frontend',async()=>{
              const response=await request('https://a-lei-do-trono.surge.sh/');
              const html=await response.text();
              const version=html.match(/name="mn-desktop-version"[^>]*content="([^"]+)"/)?.[1];
              if(!version)throw Error('Published desktop metadata not found');
              return {http:response.status,version};
            });
            await check('installer',async()=>{
              const manifest=await (await request('https://a-lei-do-trono.surge.sh/downloads/latest.yml')).text();
              const version=manifest.match(/^version:\s*(.+)$/m)?.[1]?.trim();
              const filename=manifest.match(/^path:\s*(.+)$/m)?.[1]?.trim();
              if(!/^MN-Trono-[\d.]+-Windows\.exe$/.test(filename||''))throw Error('Unexpected installer path');
              const digest=manifest.match(/^sha512:\s*(.+)$/m)?.[1]?.trim();
              if(!digest)throw Error('Published installer digest not found');
              const response=await request('https://a-lei-do-trono.surge.sh/downloads/'+filename);
              const bytes=new Uint8Array(await response.arrayBuffer());
              if(bytes[0]!==0x4d||bytes[1]!==0x5a)throw Error('Download is not a Windows executable');
              const actual=crypto.createHash('sha512').update(bytes).digest('base64');
              if(actual!==digest)throw Error('Published installer SHA-512 does not match latest.yml');
              return {version,filename,http:response.status,bytes:bytes.length,sha512Verified:true,windowsHeader:true};
            });
            await check('art',async()=>{
              const metadata=await (await request('https://similo-mn.surge.sh/version.json')).json();
              const verified=[];
              for(const theme of ['animals','history','tales','monsters','myths']){
                const path='v1/'+theme+'.webp';
                const bytes=Buffer.from(await (await request('https://similo-mn.surge.sh/'+path)).arrayBuffer());
                if(crypto.createHash('sha256').update(bytes).digest('hex')!==metadata.files?.[path])throw Error('Portrait hash mismatch: '+path);
                verified.push(path);
              }
              return {version:metadata.desktopVersion,source:metadata.source,verified};
            });
            await check('android',async()=>{
              const url='https://github.com/JonathaPereira/A-LEI-DO-TRONO-SERVER/releases/download/android-preview-v1.0.1-run-40935914610/MN-Trono-1.0.1-Android-teste.apk';
              const response=await request(url);
              const bytes=Buffer.from(await response.arrayBuffer());
              const sha256=crypto.createHash('sha256').update(bytes).digest('hex');
              if(sha256!=='cf0b9c02382ad3498c8172e20a0ba48500fa991da87248b5452abca3e4112eb2')throw Error('Android APK hash mismatch');
              const run=(await github.rest.actions.getWorkflowRun({...repo,run_id:40935914610})).data;
              if(run.conclusion!=='success')throw Error('Android emulator acceptance failed');
              return {url,bytes:bytes.length,sha256Verified:true,emulatorAccepted:true,permanentSigningConfigured:false,firebaseConfigured:false};
            });
            report.complete=report.errors.length===0&&report.checks.backend?.similo===true&&report.checks.frontend?.version==='1.0.1'&&report.checks.installer?.version==='1.0.1'&&report.checks.art?.version==='1.0.1'&&report.checks.android?.sha256Verified===true;
            report.androidBackendReady=report.checks.backend?.androidOriginAllowed===true;
            report.androidPushConfigured=report.checks.backend?.androidPush?.configured===true;
            report.voiceRecoveryActivated=report.checks.backend?.voiceResume===true;
            const path='android-1.0.1-production-check.json';let sha;
            try{sha=(await github.rest.repos.getContent({...repo,path,ref:branch})).data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({...repo,branch,path,sha,message:'chore: record current production verification',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')});
            core.summary.addRaw(JSON.stringify(report,null,2),true);await core.summary.write();
            if(!report.complete)core.setFailed('Production has pending checks; consult the recorded report.');
