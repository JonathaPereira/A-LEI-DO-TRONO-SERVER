name: Android login correction preview
on:
  push:
    branches: [codex/android-login-fixes]
    paths: [.github/workflows/android-login-preview.yml]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build shared frontend and Android test package
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run android:sync
          bash android/gradlew -p android :app:assembleDebug --no-daemon --console=plain
      - name: Publish APK for device validation
        id: publication
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs'), crypto = require('node:crypto');
            const version = require('./electron/package.json').version;
            const name = `MN-Trono-${version}-Android-login-teste.apk`;
            const data = fs.readFileSync('android/app/build/outputs/apk/debug/app-debug.apk');
            const sha256 = crypto.createHash('sha256').update(data).digest('hex');
            const tag = `android-login-fix-${context.runId}`;
            const release = (await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: `Android ${version}: correção de login e teclado`, prerelease: true,
              body: [
                `Fonte: ${context.sha}`,
                'APK usa a mesma origem HTTPS do site; frontend permanece incorporado.',
                'Corrige reserva duplicada do teclado e restaura a edição nativa dos campos.',
                'Login HTTP e handshake WebSocket verificados em fixture local antes do empacotamento.',
                'Conexão real e teclado aguardam validação no celular. Sem testes completos ou deploy do site.',
                'Assinatura de teste: se houver conflito com o APK anterior, será preciso desinstalá-lo.',
                `SHA256: ${sha256}`,
              ].join('\n'),
            })).data;
            const asset = (await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.id, name, data,
              headers: {'content-type': 'application/vnd.android.package-archive', 'content-length': data.length},
            })).data;
            core.setOutput('apk_url', asset.browser_download_url);
            core.setOutput('release_url', release.html_url);
            core.setOutput('sha256', sha256);
      - name: Record package delivery
        if: always()
        uses: actions/github-script@v7
        env:
          APK_URL: ${{ steps.publication.outputs.apk_url }}
          RELEASE_URL: ${{ steps.publication.outputs.release_url }}
          SHA256: ${{ steps.publication.outputs.sha256 }}
          PUBLISHED: ${{ steps.publication.outcome }}
        with:
          script: |
            const path = 'android-login-delivery.json', branch = 'codex/android-login-fixes';
            const report = {source: context.sha, runId: context.runId, published: process.env.PUBLISHED,
              apkUrl: process.env.APK_URL, releaseUrl: process.env.RELEASE_URL, sha256: process.env.SHA256};
            let sha;
            try {sha = (await github.rest.repos.getContent({...context.repo, path, ref: branch})).data.sha;}
            catch (error) {if (error.status !== 404) throw error;}
            await github.rest.repos.createOrUpdateFileContents({...context.repo, path, branch, sha,
              message: 'ci: record Android login preview delivery',
              content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64')});
