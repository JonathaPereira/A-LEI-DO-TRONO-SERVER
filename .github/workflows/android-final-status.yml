name: Final Android delivery status and review
on:
  push:
    branches: [codex/android-delivery-control]
    paths: [.github/workflows/android-final-status.yml]
permissions:
  contents: write
  pull-requests: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo=context.repo,branch='codex/android-delivery-control';
            const report={checkedAt:new Date().toISOString(),checks:{},errors:[]};
            const check=async(name,fn)=>{try{report.checks[name]=await fn()}catch(error){report.errors.push({name,error:error.message})}};
            await Promise.allSettled([
              check('frontend',async()=>{const response=await fetch('https://a-lei-do-trono.surge.sh/',{signal:AbortSignal.timeout(60000)});const html=await response.text();return {http:response.status,version:html.match(/name="mn-desktop-version"[^>]*content="([^"]+)"/)?.[1]}}),
              check('installer',async()=>{const response=await fetch('https://a-lei-do-trono.surge.sh/downloads/latest.yml',{signal:AbortSignal.timeout(60000)});const text=await response.text();return {http:response.status,version:text.match(/^version:\s*(.+)$/m)?.[1]?.trim(),filename:text.match(/^path:\s*(.+)$/m)?.[1]?.trim()}}),
              check('backend',async()=>{const response=await fetch('https://a-lei-do-trono-server.onrender.com/health',{signal:AbortSignal.timeout(60000)});const health=await response.json();const origin=await fetch('https://a-lei-do-trono-server.onrender.com/auth/login',{method:'OPTIONS',headers:{Origin:'https://localhost','Access-Control-Request-Method':'POST'},signal:AbortSignal.timeout(45000)});return {http:response.status,version:health.version,similo:health.features?.similo,voiceResume:health.features?.voiceResume,androidOriginStatus:origin.status,androidOriginAllowed:origin.status===204&&origin.headers.get('access-control-allow-origin')==='https://localhost',androidPush:health.androidPush??null}}),
              check('apk',async()=>{const response=await fetch('https://github.com/JonathaPereira/A-LEI-DO-TRONO-SERVER/releases/download/android-preview-v1.0.1-run-40941960824/MN-Trono-1.0.1-Android-teste.apk',{method:'HEAD',signal:AbortSignal.timeout(60000)});return {http:response.status,bytes:Number(response.headers.get('content-length'))}})
            ]);
            await check('review',async()=>{
              const head='codex/android-app';
              const source=(await github.rest.git.getRef({...repo,ref:'heads/'+head})).data.object.sha;
              const main=(await github.rest.git.getRef({...repo,ref:'heads/main'})).data.object.sha;
              const pulls=(await github.rest.pulls.list({...repo,head:repo.owner+':'+head,state:'all'})).data;
              const existing=pulls.find(p=>p.state==='open'||p.merged_at);
              if(existing)return {main,source,number:existing.number,url:existing.html_url,state:existing.state,mergedAt:existing.merged_at};
              const title='Trono 1.0.1: Android com interface mobile e chamadas em segundo plano';
              const body=[
                'Adiciona o host Android 8+ usando a interface Next/TypeScript e os mesmos donos de conta, socket, jogos e mídia. No celular, navegação inferior, catálogo e painel de membros usam uma composição própria. Minimizar conserva a chamada com foreground service e aviso nativo; sair libera o serviço. A sessão lembrada usa Android Keystore.',
                'Prepara push FCM genérico para DMs e pedidos de amizade, isolado por conta, preferência e mutes. Firebase permanece desativado sem configuração. Não altera regras dos jogos; corrige a coluna implícita que estreitava o conteúdo com membros abertos no mobile.',
                'Validação: duas rodadas locais de Love Letter/Similo/DMs/mobile; core e browser no CI; [Android API35](https://github.com/JonathaPereira/A-LEI-DO-TRONO-SERVER/actions/runs/40941960824); [Windows/Electron/NSIS/Surge](https://github.com/JonathaPereira/A-LEI-DO-TRONO-SERVER/actions/runs/40942027782). Frontend, EXE e cinco folhas de arte publicados com hashes completos conferidos; APK corrigido conferido com SHA-256 e assinatura de teste válida.',
                'Ativação: merge/deploy do backend autoriza https://localhost. Push exige projeto Firebase, configuração Android no GitHub, segredo de serviço somente no backend e SQL aditivo supabase/upgrade-android-push.sql. Não executar install.sql em banco existente. A distribuição definitiva exige chave Android permanente. O [guia](docs/DESENVOLVIMENTO_DESKTOP.md#android-gerar-e-configurar) contém os passos.',
                'Limites: testes usaram microfone virtual no emulador; validação em aparelho, áudio físico, Bluetooth e tela bloqueada prolongada permanecem pendentes. Captura nativa de tela/áudio de outros apps, host de Remote PC e push de canais não foram portados. Web/Windows conservam seus recursos.'
              ].join('\n\n');
              try{const created=(await github.rest.pulls.create({...repo,base:'main',head,title,body,draft:false})).data;return {main,source,number:created.number,url:created.html_url,state:created.state,created:true}}catch(error){return {main,source,created:false,blocked:error.message,compareUrl:'https://github.com/'+repo.owner+'/'+repo.repo+'/compare/main...codex/android-app?expand=1'}}
            });
            report.recordedAt=new Date().toISOString();
            const path='android-final-status.json';let sha;try{sha=(await github.rest.repos.getContent({...repo,path,ref:branch})).data.sha}catch(error){if(error.status!==404)throw error}
            await github.rest.repos.createOrUpdateFileContents({...repo,branch,path,sha,message:'ci: record current Android availability and PR status',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')});
            await core.summary.addCodeBlock(JSON.stringify(report,null,2),'json').write();
