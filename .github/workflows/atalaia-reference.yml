name: Inspect supplied Atalaia web reference
on:
  push:
    branches: [codex/desktop-atalaia-visual-refresh]
    paths: [.github/workflows/atalaia-reference.yml]
permissions:
  contents: write
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read the user supplied public reference
        shell: bash
        run: |
          mkdir -p artifacts/reference-cache
          curl --location --silent --show-error --max-time 45 --max-filesize 15000000 --output artifacts/reference-cache/index.html --write-out '%{http_code}\n' https://bastiao-eterno-demo.richlotus33.chatgpt.site/ > artifacts/reference-cache/status.txt || true
          git add -f artifacts/reference-cache/index.html artifacts/reference-cache/status.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Capture user supplied web reference for Atalaia comparison'
          git push origin HEAD:refs/heads/codex/atalaia-reference-cache
