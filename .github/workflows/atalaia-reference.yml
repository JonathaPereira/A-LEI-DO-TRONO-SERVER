name: Inspect the original Atalaia visuals and animation sources
on:
  push:
    branches: [codex/desktop-atalaia-visual-refresh]
    paths: [.github/workflows/atalaia-reference.yml]
permissions:
  contents: write
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Read the user supplied public reference
        shell: bash
        run: |
          git fetch origin codex/atalaia-reference-cache
          git checkout -B codex/atalaia-reference-cache FETCH_HEAD
          mkdir -p artifacts/reference-cache
          curl --location --silent --show-error --max-time 45 --max-filesize 15000000 --output artifacts/reference-cache/index.html --write-out '%{http_code}\n' https://bastiao-eterno-demo.richlotus33.chatgpt.site/ > artifacts/reference-cache/status.txt || true
          curl --location --fail --silent --show-error --max-time 45 --max-filesize 15000000 https://bastiao-eterno-demo.richlotus33.chatgpt.site/app.mjs?v=0.6.1 -o artifacts/reference-cache/app.mjs
          curl --location --fail --silent --show-error --max-time 45 --max-filesize 15000000 https://bastiao-eterno-demo.richlotus33.chatgpt.site/style.css?v=0.6.1 -o artifacts/reference-cache/style.css
          for module in engine render telemetry report sidebar world sprites; do
            curl --location --fail --silent --show-error --max-time 30 --max-filesize 15000000 "https://bastiao-eterno-demo.richlotus33.chatgpt.site/$module.mjs" -o "artifacts/reference-cache/$module.mjs"
          done
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          node <<'JS'
          const {chromium}=require('@playwright/test');
          (async()=>{
            const browser=await chromium.launch({args:['--no-sandbox']});
            try {
              const page=await browser.newPage({viewport:{width:1600,height:1000}});
              await page.goto('https://bastiao-eterno-demo.richlotus33.chatgpt.site/',{waitUntil:'networkidle',timeout:60000});
              await page.screenshot({path:'artifacts/reference-cache/web-home.png'});
              await page.getByRole('button',{name:'Iniciar expedição',exact:true}).click();
              await page.waitForTimeout(2000);
              await page.screenshot({path:'artifacts/reference-cache/web-game.png'});
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
          git add -f artifacts/reference-cache
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Capture user supplied web reference for Atalaia comparison'
          git push origin HEAD:refs/heads/codex/atalaia-reference-cache
