name: Windows full app
on:
  push:
    branches: [main, codex/windows-app-foundation, 'codex/desktop-*', 'codex/next-*']
    paths:
      [
        'electron/**',
        'src/**',
        'public/**',
        'server/**',
        'scripts/**',
        'tests/**',
        'supabase/**',
        'package*.json',
        '*config*',
        '.github/workflows/windows-app.yml',
      ]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci
        working-directory: electron
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:server:lifecycle
      - name: Verify profile validation and persistence
        run: node --test tests/member-profiles.js tests/profile-media.js tests/giphy-provider.js
      - name: Install Chromium for integration tests
        run: npx playwright install chromium
      - name: Verify SFU recovery and floating call layout
        shell: pwsh
        run: |
          npm run test:sfu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify outgoing microphone PCM with real Windows background windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node --test tests/desktop-background-voice.js 2>&1 | Tee-Object artifacts/windows-background-voice.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $details = ((Get-Content artifacts/windows-background-voice.log | Select-Object -Last 70) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Background outgoing microphone::$details"
            exit $testExit
          }
      - name: Verify call workspace and profile layouts
        shell: pwsh
        run: |
          node --test --test-concurrency=1 tests/chat-composer-browser.cjs tests/channels-browser.cjs tests/app-layout-browser.js tests/profile-media-browser.js tests/call-controls-browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QA_NATIVE = '1'
          node --test --test-concurrency=1 tests/app-layout-browser.js tests/profile-media-browser.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:QA_NATIVE
      - name: Verify native roguelite frame before packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node --test tests/desktop-cinzas-runtime.js 2>&1 | Tee-Object artifacts/windows-cinzas-runtime.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $details = ((Get-Content artifacts/windows-cinzas-runtime.log | Select-Object -Last 45) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Native roguelite frame::$details"
            exit $testExit
          }
      - name: Verify received voice under UI load
        shell: pwsh
        run: |
          node --test tests/voice-reception-browser.js 2>&1 | Tee-Object artifacts/windows-voice-reception.log
          $testExit = $LASTEXITCODE
          $voiceResult = ((Select-String -Path artifacts/windows-voice-reception.log -Pattern 'Receive PCM under long UI tasks|skipped' | ForEach-Object { $_.Line }) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
          Write-Output "::notice title=Received voice evidence::$voiceResult"
          if (Select-String -Path artifacts/windows-voice-reception.log -Pattern 'skipped [1-9]') { $testExit = 1 }
          if ($testExit -ne 0) {
            $details = ((Get-Content artifacts/windows-voice-reception.log | Select-Object -Last 60) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Voice reception under load::$details"
            exit $testExit
          }
      - name: Verify microphone PCM and native processing
        run: node --test --test-concurrency=1 tests/native-microphone-browser.js tests/light-noise-processing.js
      - name: Verify Splendor player visibility and stable Love Letter logs
        run: node --test --test-concurrency=1 tests/splendor-browser.js tests/love-letter-browser.js
      - name: Verify revised game rules and independent voice
        run: node --test tests/game-rules.js tests/game-voice-membership.js tests/game-rounds.js tests/azul-rules.js tests/azul-presentation.js tests/azul-sql.js tests/azul-ws.js
      - name: Verify private attachments and creator moderation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node --test tests/chat-moderation-sql.js tests/chat-moderation-ws.js tests/direct-attachments-sql.js tests/direct-attachments-http.js 2>&1 | Tee-Object artifacts/windows-messaging.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $details = ((Get-Content artifacts/windows-messaging.log | Select-Object -Last 90) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows messaging validation::$details"
            exit $testExit
          }
      - name: Verify Cinzas v0.5 gameplay and verified offline media cache
        run: node --test tests/cinzas-upstream.js tests/game-assets.js
      - name: Verify Splendor classic rules, private tables and persistent records
        shell: pwsh
        run: |
          node --test tests/splendor-rules.js tests/splendor-sql.js tests/splendor-ws.js 2>&1 | Tee-Object artifacts/windows-splendor.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $details = ((Get-Content artifacts/windows-splendor.log | Select-Object -Last 65) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Splendor validation::$details"
            exit $testExit
          }
      - name: Verify Love Letter second edition and private hands
        shell: pwsh
        run: |
          node --test tests/love-letter-rules.js tests/love-letter-ws.js tests/bot-names.js 2>&1 | Tee-Object artifacts/windows-love-letter.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $details = ((Get-Content artifacts/windows-love-letter.log | Select-Object -Last 60) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Love Letter validation::$details"
            exit $testExit
          }
      - name: Build Windows application audio capture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm run build:native 2>&1 | Tee-Object artifacts/native-audio-build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $details = ((Get-Content artifacts/native-audio-build.log | Select-Object -Last 45) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows native audio::$details"
            exit $buildExit
          }
        working-directory: electron
      - name: Test desktop policy and native Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          node --test tests/desktop-policy.js tests/desktop-updates.js tests/desktop-preferences.js tests/desktop-activity.js tests/desktop-notifications.js tests/call-stability.js tests/voice-reception.js tests/desktop-audio-priority.js tests/desktop-audio.js tests/desktop-runtime.js tests/site-package.js tests/download-retention.js tests/build-downloads.js 2>&1 | Tee-Object artifacts/windows-runtime.log
          $testExit = $LASTEXITCODE
          $audioResult = ((Select-String -Path artifacts/windows-runtime.log -Pattern 'application loopback|no active audio output|skipped' | ForEach-Object { $_.Line }) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
          Write-Output "::notice title=Application audio validation::$audioResult"
          if ($testExit -ne 0) {
            $details = ((Get-Content artifacts/windows-runtime.log | Select-Object -Last 25) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows app runtime::$details"
            exit $testExit
          }
      - name: Verify call controls preserve live desktop media across layouts
        run: npm run test:desktop:layout
      - name: Build Windows application directory
        run: npx electron-builder --win --x64 --dir --publish never
        working-directory: electron
      - name: Verify the compiled Windows app
        shell: pwsh
        run: |
          node --test tests/desktop-packaged.js 2>&1 | Tee-Object artifacts/windows-packaged.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $details = ((Get-Content artifacts/windows-packaged.log | Select-Object -Last 45) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows packaged app::$details"
            exit $testExit
          }
      - name: Build Windows x64 installer
        run: npm run pack:win
        working-directory: electron
      - name: Prepare user download
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/desktop/prepare-downloads.cjs
      - name: Compress the frontend with only its latest installer
        shell: pwsh
        run: |
          $version = (Get-Content electron/package.json | ConvertFrom-Json).version
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path artifacts/site-download), (Join-Path (Resolve-Path artifacts) "MN-Trono-Frontend-$version.zip"), [System.IO.Compression.CompressionLevel]::Optimal, $false)
      - name: Publish validated downloads in a private draft release
        uses: actions/github-script@v7
        with:
          script: |
            const {publishBuild}=require('./scripts/desktop/publish-build.cjs');
            await publishBuild({github,context,core});
      - name: Retain only current and previous distribution artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const {cleanArtifacts}=require('./scripts/desktop/download-retention.cjs');
            await cleanArtifacts({github,context,core,protectedRunIds:[38570134416]});
