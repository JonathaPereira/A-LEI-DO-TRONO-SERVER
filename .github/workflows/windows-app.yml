name: Windows full app
on:
  push:
    branches: [main, codex/windows-app-foundation, 'codex/desktop-*', 'codex/next-*', 'codex/men-games-*']
    paths:
      [
        '.gitattributes',
        'electron/**',
        'src/**',
        'public/**',
        'games/atalaia/**',
        'games/similo/**',
        'server/**',
        'scripts/**',
        'tests/**',
        'supabase/**',
        'package*.json',
        '*config*',
        '.github/workflows/windows-app.yml',
      ]
  workflow_dispatch:
    inputs:
      publish_surge:
        description: Publish the validated delivery to Surge automatically
        type: boolean
        default: true
      extended_browser:
        description: Run every browser regression instead of the release journeys
        type: boolean
        default: false
      full_tests:
        description: Run full release test suites even for focused changes
        type: boolean
        default: false
      refresh_instructions:
        description: Refresh only instructions and hashes in an existing draft release
        type: boolean
        default: false
      release_tag:
        description: Exact draft build tag, required for instruction refresh
        type: string
        default: ''
permissions:
  contents: write
  actions: write
jobs:
  refresh-instructions:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_instructions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refresh only the draft instructions and checksums
        uses: actions/github-script@v7
        env:
          TASK_RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const version=require('./electron/package.json').version;
            const tag=process.env.TASK_RELEASE_TAG;
            if(!tag.startsWith(`desktop-v${version}-run-`)||!/^[a-zA-Z0-9.-]+$/.test(tag))throw Error('Choose a build tag for the current desktop version.');
            const releases=await github.paginate(github.rest.repos.listReleases,{...context.repo,per_page:100});
            const release=releases.find(r=>r.tag_name===tag);
            if(!release?.draft)throw Error('Only a draft release can have its instructions refreshed.');
            const names=[`MN-Trono-${version}-Windows.exe`,`MN-Trono-Frontend-${version}.zip`,`Atalaia-Web-${version}.zip`,`Similo-Art-${version}.zip`];
            const lines=names.map(name=>{
              const asset=release.assets.find(a=>a.name===name);
              if(!asset||asset.size<1000000||!/^sha256:[a-f0-9]{64}$/.test(asset.digest||''))throw Error('Missing verified binary asset: '+name);
              return asset.digest.slice(7)+'  '+name;
            });
            const instructions=fs.readFileSync('electron/LEIA-ME-WINDOWS.txt');
            if(!instructions.toString('utf8').split(/\r?\n/)[0].includes('Windows '+version))throw Error('Instruction heading must match the desktop version.');
            lines.push(crypto.createHash('sha256').update(instructions).digest('hex')+'  LEIA-ME-WINDOWS.txt');
            const files=[{name:'LEIA-ME-WINDOWS.txt',data:instructions},{name:`SHA256SUMS-${version}.txt`,data:Buffer.from(lines.join('\n')+'\n')}];
            for(const file of files){
              const old=release.assets.find(a=>a.name===file.name);
              if(old)await github.rest.repos.deleteReleaseAsset({...context.repo,asset_id:old.id});
              await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name:file.name,data:file.data,headers:{'content-type':'text/plain','content-length':file.data.length}});
            }
            core.notice('Instructions refreshed; EXE and ZIP assets were preserved: '+release.html_url);
  windows:
    name: Validate and package Windows
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.refresh_instructions) }}
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.extended_browser && 35 || 25 }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
    outputs:
      release_tag: ${{ steps.distribution.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - name: Plan selective test execution
        id: plan
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EXTENDED_BROWSER: ${{ inputs.extended_browser || false }}
          FULL_TESTS: ${{ inputs.full_tests || false }}
        run: |
          if ($env:EXTENDED_BROWSER -eq 'true' -or $env:FULL_TESTS -eq 'true' -or $env:EVENT_NAME -ne 'push') {
            node scripts/select-tests.cjs --full --github-output $env:GITHUB_OUTPUT
          } else {
            node scripts/select-tests.cjs --base $env:BEFORE_SHA --head $env:CURRENT_SHA --github-output $env:GITHUB_OUTPUT
          }
          exit $LASTEXITCODE
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ms-playwright
          key: playwright-win-${{ hashFiles('package-lock.json') }}
      - name: Cache Godot tools
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: artifacts/godot-tools
          key: godot-win64-${{ hashFiles('scripts/prepare-godot.cjs') }}
      - name: Cache FFmpeg binaries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: artifacts/ffmpeg
          key: ffmpeg-win64-${{ hashFiles('scripts/desktop/prepare-ffmpeg.cjs', 'electron/ffmpeg-notices/**') }}
      - name: Cache native audio helpers
        id: native-cache
        uses: actions/cache@v4
        with:
          path: artifacts/native-audio/Release
          key: native-audio-win64-${{ hashFiles('electron/native-audio/**', 'scripts/desktop/build-native.cjs') }}
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-win-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-win-${{ hashFiles('package-lock.json') }}-
      - name: Install dependencies once
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix electron ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ steps.playwright-cache.outputs.cache-hit }}' -ne 'true') {
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Using cached Playwright Chromium binary.'
          }
          exit 0
      - name: Export the complete Atalaia game for the web
        shell: pwsh
        run: |
          if (!(Test-Path 'artifacts/godot-tools/runtime.json')) {
            node scripts/prepare-godot.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Using cached Godot runtime.'
          }
          node scripts/build-atalaia.cjs 2>&1 | Tee-Object artifacts/atalaia-build.log
          exit $LASTEXITCODE
      - name: Prepare Similo art for its separate static domain
        run: node scripts/build-similo-art.cjs
      - name: Check sources and build frontend and native helpers once
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'artifacts/native-audio/Release/MN-Application-Audio.exe') -or !(Test-Path 'artifacts/native-audio/Release/MN-Remote-Input.exe')) {
            npm --prefix electron run build:native 2>&1 | Tee-Object artifacts/windows-native-build.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Using cached native audio helpers.'
          }
          if (!(Test-Path 'artifacts/ffmpeg/bin/ffmpeg.exe')) {
            node scripts/desktop/prepare-ffmpeg.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Using cached FFmpeg binaries.'
          }
          exit 0
      - name: Verify contracts and real user journeys
        shell: pwsh
        env:
          EXTENDED_BROWSER: ${{ inputs.extended_browser || false }}
          PLAN_MODE: ${{ steps.plan.outputs.mode }}
          PLAN_REASONS: ${{ steps.plan.outputs.reasons }}
          RUN_CORE: ${{ steps.plan.outputs.run_core }}
          BROWSER_MODE: ${{ steps.plan.outputs.browser_mode }}
          BROWSER_FILTER: ${{ steps.plan.outputs.browser_filter }}
          DESKTOP_MODE: ${{ steps.plan.outputs.desktop_mode }}
          DESKTOP_FILTER: ${{ steps.plan.outputs.desktop_filter }}
        run: |
          Write-Host "Test plan: mode=$env:PLAN_MODE browser=$env:BROWSER_MODE ($env:BROWSER_FILTER) desktop=$env:DESKTOP_MODE ($env:DESKTOP_FILTER) reasons=$env:PLAN_REASONS"
          if ($env:RUN_CORE -eq 'true') {
            npm test 2>&1 | Tee-Object artifacts/windows-core.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($env:EXTENDED_BROWSER -eq 'true') {
            node scripts/test.cjs --suite browser 2>&1 | Tee-Object artifacts/windows-browser.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($env:BROWSER_MODE -eq 'release') {
            node scripts/test.cjs --suite browser --profile release 2>&1 | Tee-Object artifacts/windows-browser.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($env:BROWSER_MODE -eq 'filtered' -and $env:BROWSER_FILTER) {
            node scripts/test.cjs --suite browser --filter $env:BROWSER_FILTER 2>&1 | Tee-Object artifacts/windows-browser.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Skipping unrelated browser tests for this change.'
          }
          if ($env:DESKTOP_MODE -eq 'release') {
            node scripts/test.cjs --suite desktop --profile release 2>&1 | Tee-Object artifacts/windows-desktop.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } elseif ($env:DESKTOP_MODE -eq 'filtered' -and $env:DESKTOP_FILTER) {
            node scripts/test.cjs --suite desktop --filter $env:DESKTOP_FILTER 2>&1 | Tee-Object artifacts/windows-desktop.log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'Skipping unrelated un-packaged desktop tests for this change.'
          }
          exit 0
      - name: Package and smoke test the actual executable
        shell: pwsh
        run: |
          npm --prefix electron run pack:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test -- --suite desktop --filter '(?:desktop-packaged\.js)$' 2>&1 | Tee-Object artifacts/windows-packaged.log
          exit $LASTEXITCODE
      - name: Accept the real installer on the disposable runner
        shell: pwsh
        run: |
          npm test -- --suite desktop --filter '(?:desktop-installer\.js)$' 2>&1 | Tee-Object artifacts/windows-installer.log
          $testExit = $LASTEXITCODE
          if (Select-String -Path artifacts/windows-installer.log -Pattern 'skipped [1-9]|# SKIP\b') { $testExit = 1 }
          exit $testExit
      - name: Prepare the matched frontend and installer download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          node scripts/desktop/prepare-downloads.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content electron/package.json | ConvertFrom-Json).version
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path artifacts/site-download), (Join-Path (Resolve-Path artifacts) "MN-Trono-Frontend-$version.zip"), [System.IO.Compression.CompressionLevel]::Optimal, $false)
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path artifacts/atalaia/web), (Join-Path (Resolve-Path artifacts) "Atalaia-Web-$version.zip"), [System.IO.Compression.CompressionLevel]::Optimal, $false)
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path artifacts/similo-art), (Join-Path (Resolve-Path artifacts) "Similo-Art-$version.zip"), [System.IO.Compression.CompressionLevel]::Optimal, $false)
      - name: Save the validated delivery in a private draft release
        id: distribution
        uses: actions/github-script@v7
        with:
          script: |
            const {publishBuild}=require('./scripts/desktop/publish-build.cjs');
            const version=require('./electron/package.json').version;
            const result=await publishBuild({github,context,core,additionalFiles:[`artifacts/Atalaia-Web-${version}.zip`,`artifacts/Similo-Art-${version}.zip`]});
            core.setOutput('tag',result.tag);
      - name: Report failed test summaries
        if: failure()
        run: node scripts/desktop/failure-summary.cjs
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            artifacts/windows-*.log
            artifacts/atalaia-build.log
            artifacts/atalaia/*.png
            artifacts/similo/screens/*.png
            artifacts/frontend-reset/call-qa
            artifacts/frontend-reset/auth-regression/*.png
            artifacts/profile-media*/failure-*.png

  publish-surge:
    name: Publish validated delivery to Surge
    needs: [windows]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/men-games-separation')) || (github.event_name == 'workflow_dispatch' && inputs.publish_surge)
    uses: ./.github/workflows/frontend-publish.yml
    with:
      release_tag: ${{ needs.windows.outputs.release_tag }}
    secrets:
      SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
