name: Stop unpublished Similo candidate for HUD correction
on:
  push:
    branches: [codex/similo-delivery-control]
    paths: [.github/workflows/similo-cancel-unpublished.yml]
permissions:
  actions: write
  contents: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run_id=40612206178;
            const {data}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
            if(data.status!=='completed')await github.rest.actions.cancelWorkflowRun({...context.repo,run_id});
            core.notice('Previous candidate cancellation requested. A proven seven-vote HUD overflow is being fixed before release.');
      - name: Extract the cancelled test evidence from the previous candidate
        uses: actions/github-script@v7
        with:
          script: |
            const job_id=122566217915;
            const result=await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',{...context.repo,job_id});
            const text=typeof result.data==='string'?result.data:Buffer.from(result.data).toString('utf8');
            const lines=text.split('\n'),indices=new Set();
            lines.forEach((line,i)=>{if(/not ok [0-9]+|testTimeoutFailure|cancelledByParent|Timed out|testCodeFailure|TimeoutError/.test(line))for(let j=Math.max(0,i-5);j<Math.min(lines.length,i+55);j++)indices.add(j);});
            const content=[...indices].sort((a,b)=>a-b).map(i=>lines[i]).join('\n');
            await github.rest.repos.createOrUpdateFileContents({...context.repo,branch:'codex/similo-delivery-control',path:'similo-diagnosis-40612206178.log',message:'chore: record exact failed test evidence',content:Buffer.from(content).toString('base64')});
