name: Stop unpublished Similo candidate for HUD correction
on:
  push:
    branches: [codex/similo-delivery-control]
    paths: [.github/workflows/similo-cancel-unpublished.yml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run_id=40612206178;
            const {data}=await github.rest.actions.getWorkflowRun({...context.repo,run_id});
            if(data.status!=='completed')await github.rest.actions.cancelWorkflowRun({...context.repo,run_id});
            core.notice('Previous candidate cancellation requested. A proven seven-vote HUD overflow is being fixed before release.');
