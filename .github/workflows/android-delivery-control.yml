name: Inspect Android delivery
on:
  push:
    branches: [codex/android-delivery-control]
    paths: [.github/workflows/android-delivery-control.yml]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo=context.repo, branch='codex/android-delivery-control';
            const save=async report=>{
              const ref=(await github.rest.git.getRef({...repo,ref:'heads/'+branch})).data.object.sha;
              const parent=(await github.rest.git.getCommit({...repo,commit_sha:ref})).data;
              const blob=(await github.rest.git.createBlob({...repo,content:JSON.stringify(report,null,2)+'\n',encoding:'utf-8'})).data;
              const tree=(await github.rest.git.createTree({...repo,base_tree:parent.tree.sha,tree:[{path:'android-monitor-status.json',mode:'100644',type:'blob',sha:blob.sha}]})).data;
              const next=(await github.rest.git.createCommit({...repo,message:'ci: record Android delivery inspection',tree:tree.sha,parents:[ref]})).data;
              await github.rest.git.updateRef({...repo,ref:'heads/'+branch,sha:next.sha});
            };
            let previous='';
            for(let attempt=0;attempt<60;attempt++){
              const runs=(await github.rest.actions.listWorkflowRuns({...repo,workflow_id:'android-app.yml',branch:'codex/android-app',per_page:5})).data.workflow_runs;
              const run=runs[0];
              if(!run){await new Promise(r=>setTimeout(r,15000));continue;}
              const jobs=(await github.rest.actions.listJobsForWorkflowRun({...repo,run_id:run.id,per_page:100})).data.jobs;
              const report={checkedAt:new Date().toISOString(),runId:run.id,source:run.head_sha,status:run.status,conclusion:run.conclusion,url:run.html_url,jobs:jobs.map(j=>({id:j.id,name:j.name,status:j.status,conclusion:j.conclusion,steps:j.steps.map(s=>({name:s.name,status:s.status,conclusion:s.conclusion}))})),failures:[]};
              if(run.status==='completed'&&run.conclusion!=='success')for(const job of jobs.filter(j=>j.conclusion==='failure')){
                const log=await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',{...repo,job_id:job.id});
                let content=typeof log.data==='string'?log.data:JSON.stringify(log.data);
                if(content.startsWith('http'))content=await(await fetch(content)).text();
                report.failures.push({job:job.name,tail:content.split('\n').slice(-100).join('\n').replace(/[A-Za-z0-9_-]{60,}/g,'[long value omitted]')});
              }
              const signature=JSON.stringify([report.runId,report.status,report.conclusion,report.jobs]);
              if(signature!==previous){await save(report);previous=signature;}
              if(run.status==='completed')return;
              await new Promise(r=>setTimeout(r,15000));
            }
