<svg xmlns="http://www.w3.org/2000/svg" width="360" height="504" viewBox="0 0 360 504" role="img" aria-labelledby="title desc"><title id="title">ESTANDARTE · A Lei do Trono</title><desc id="desc">A Sombra anterior declara o trunfo. Dois ou mais: maior / menor trunfo. Um: Coroa; Sombra é menor dos demais. Nenhum trunfo: aplica-se Ordem.</desc><defs><linearGradient id="paper" x2=".8" y2="1"><stop stop-color="#faf0d5"/><stop offset="1" stop-color="#e6cfa0"/></linearGradient><radialGradient id="seal"><stop stop-color="#fff7df"/><stop offset="1" stop-color="#dac18d"/></radialGradient></defs><rect x="2" y="2" width="356" height="500" rx="22" fill="url(#paper)" stroke="#785b2f" stroke-width="4"/><rect x="14" y="14" width="332" height="476" rx="15" fill="none" stroke="#b79754" stroke-width="1.5"/><path d="M28 73V28h45M287 28h45v45M28 431v45h45M287 476h45v-45" fill="none" stroke="#41668b" stroke-width="2"/><path d="m32 36 9 0-4 8-5-8Zm296 0-9 0 4 8 5-8Zm-296 432 9 0-4-8-5 8Zm296 0-9 0 4-8 5 8Z" fill="#41668b"/><text x="180" y="44" text-anchor="middle" font-family="Georgia,serif" font-size="9" letter-spacing="3" fill="#73592c">A LEI DO TRONO</text><text x="180" y="82" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="25" letter-spacing="1" fill="#41668b">ESTANDARTE</text><path d="M60 100h240" stroke="#b79754"/><circle cx="180" cy="236" r="91" fill="url(#seal)" stroke="#41668b" stroke-width="1.5"/><circle cx="180" cy="236" r="84" fill="none" stroke="#41668b" stroke-dasharray="2 8" opacity=".7"/><g transform="translate(109 165) scale(1.48)" stroke="#41668b" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M25 12v78M25 18h53l-9 18 9 18H25M16 90h18"/><path d="m42 25 5 11 12 1-9 8 3 12-10-7-10 7 2-12-9-8 12-1Z" transform="translate(7 -6) scale(.8)"/></g><path d="M60 355h240" stroke="#b79754"/><text x="180" y="382" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#3c3528">A Sombra anterior declara o trunfo.</text><text x="180" y="402" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#3c3528">Dois ou mais: maior / menor trunfo.</text><text x="180" y="422" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#3c3528">Um: Coroa; Sombra é menor dos demais.</text><text x="180" y="442" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#3c3528">Nenhum trunfo: aplica-se Ordem.</text><text x="180" y="471" text-anchor="middle" font-family="Georgia,serif" font-size="8" letter-spacing="2" fill="#826832">REGRAS 0.9.0 · LEI DA VAZA</text></svg>