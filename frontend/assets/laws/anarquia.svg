" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#3c3528">Coroa: maior carta.</text><text x="180" y="422" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#3c3528">Sombra: menor carta dos demais.</text><text x="180" y="442" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#3c3528">Só o valor efetivo importa.</text><text x="180" y="471" text-anchor="middle" font-family="Georgia,serif" font-size="8" letter-spacing="2" fill="#826832">REGRAS 0.9.0 · LEI DA VAZA</text></svg>