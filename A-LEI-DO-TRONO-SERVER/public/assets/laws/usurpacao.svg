<svg xmlns="http://www.w3.org/2000/svg" width="360" height="504" viewBox="0 0 360 504" role="img" aria-labelledby="title desc"><title id="title">USURPAÇÃO · A Lei do Trono</title><desc id="desc">A Sombra escolhe qualquer adversário. Separa uma carta e escolhe às cegas. A própria carta nunca retorna. Depois, joga-se como Ordem.</desc><defs><linearGradient id="paper" x2=".8" y2="1"><stop stop-color="#faf0d5"/><stop offset="1" stop-color="#e6cfa0"/></linearGradient><radialGradient id="seal"><stop stop-color="#fff7df"/><stop offset="1" stop-color="#dac18d"/></radialGradient></defs><rect x="2" y="2" width="356" height="500" rx="22" fill="url(#paper)" stroke="#785b2f" stroke-width="4"/><rect x="14" y="14" width="332" height="476" rx="15" fill="none" stroke="#b79754" stroke-width="1.5"/><path d="M28 73V28h45M287 28h45v45M28 431v45h45M287 476h45v-45" fill="none" stroke="#495e63" stroke-width="2"/><path d="m32 36 9 0-4 8-5-8Zm296 0-9 0 4 8 5-8Zm-296 432 9 0-4-8-5 8Zm296 0-9 0 4-8 5 8Z" fill="#495e63"/><text x="180" y="44" text-anchor="middle" font-family="Georgia,serif" font-size="9" letter-spacing="3" fill="#73592c">A LEI DO TRONO</text><text x="180" y="82" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="25" letter-spacing="1" fill="#495e63">USURPAÇÃO</text><path d="M60 100h240" stroke="#b79754"/><circle cx="180" cy="236" r="91" fill="url(#seal)" stroke="#495e63" stroke-width="1.5"/><circle cx="180" cy="236" r="84" fill="none" stroke="#495e63" stroke-dasharray="2 8" opacity=".7"/><g transform="translate(109 165) scale(1.48)" stroke="#495e63" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="24" width="28" height="42" rx="4" transform="rotate(-8 27 45)"/><rect x="55" y="26" width="28" height="42" rx="4" transform="rotate(8 69 47)"/><path d="M30 14q30-14 49 6l-12-2M79 20l-2-11M68 80Q34 97 16 75l12 3M16 75l2 13"/><path d="m21 44 6-9 6 9-6 9-6-9ZM62 46l7-9 7 9-7 9-7-9Z"/></g><path d="M60 355h240" stroke="#b79754"/><text x="180" y="382" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#3c3528">A Sombra escolhe qualquer adversário.</text><text x="180" y="402" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#3c3528">Separa uma carta e escolhe às cegas.</text><text x="180" y="422" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#3c3528">A própria carta nunca retorna.</text><text x="180" y="442" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#3c3528">Depois, joga-se como Ordem.</text><text x="180" y="471" text-anchor="middle" font-family="Georgia,serif" font-size="8" letter-spacing="2" fill="#826832">REGRAS 0.9.0 · LEI DA VAZA</text></svg>