<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Lei do Trono · Nexus</title>
<style>
body{margin:0;background:#07111f;color:#e8f3ff;font:16px system-ui}main{max-width:1400px;margin:40px auto;padding:20px}h1{font-size:36px;margin-bottom:8px}p{color:#b4c7db;line-height:1.6}.stage{display:grid;place-items:center;min-height:360px;aspect-ratio:16/9;border:1px solid #31566f;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,#17354d,#080e18)}button,a{color:#061d2c;background:#62d8ed;border:0;border-radius:9px;padding:14px 22px;font:600 16px system-ui;cursor:pointer}iframe{width:100%;height:100%;border:0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.actions a{color:#b6e9ff;background:transparent;border:1px solid #31566f;text-decoration:none}.stage:fullscreen{border:0;border-radius:0;width:100vw;height:100vh}#message{min-height:24px}
</style>
<main><p>A LEI DO TRONO · JOGOS</p><h1>Nexus: Ecos do Crepúsculo</h1><p>Campanha tática e arena PvP. Prepare três heróis, combine classes e escolha seus engastes.</p><div class="stage" id="stage"><button id="play">Carregar e jogar</button></div><p id="message" role="status">Os arquivos do jogo serão baixados apenas quando você clicar em jogar.</p><div class="actions"><a id="external" hidden target="_blank" rel="noopener">Abrir em outra página</a><button id="fullscreen">Tela cheia</button></div></main>
<script>
// Copy only the https:// URL from the iframe generated by itch.io's Embed game.
// The heavy Godot export belongs on itch.io, outside the Surge upload directory.
const GAME_EMBED_URL = 'COLE_AQUI_O_SRC_DO_IFRAME_DO_ITCH_IO';
const stage=document.getElementById('stage');
let valid=false;try{const u=new URL(GAME_EMBED_URL);valid=u.protocol==='https:'}catch{}
if(valid){const external=document.getElementById('external');external.href=GAME_EMBED_URL;external.hidden=false}
document.getElementById('play').onclick=()=>{
 if(!valid){document.getElementById('message').textContent='Configure GAME_EMBED_URL com o endereço de incorporação do jogo publicado.';return}
 const frame=document.createElement('iframe');frame.src=GAME_EMBED_URL;frame.title='Nexus — jogo tático';frame.allow='autoplay; fullscreen; gamepad';frame.allowFullscreen=true;stage.replaceChildren(frame);document.getElementById('message').textContent='No PvP: selecione Batalhas → Arena PvP online. Crie uma sala ou entre pelo código.';
};
document.getElementById('fullscreen').onclick=async()=>{try{await stage.requestFullscreen()}catch{document.getElementById('message').textContent='Use o botão de tela cheia dentro do jogo ou abra em outra página.'}};
</script>
</html>
